name: Tooling Tests

on:
  push:
    branches:
      - master
      - main
    paths:
      - "package.json"
      - "tooling~/**"
      - "Runtime/**"
      - "Editor/**"
      - "Samples~/**"
      - "Tests/**"
      - "Generator~/**"
      - ".config/dotnet-tools.json"
      - ".github/workflows/tooling-tests.yml"
      - ".github/workflows/release*.yml"
  pull_request:
    paths:
      - "package.json"
      - "tooling~/**"
      - "Runtime/**"
      - "Editor/**"
      - "Samples~/**"
      - "Tests/**"
      - "Generator~/**"
      - ".config/dotnet-tools.json"
      - ".github/workflows/tooling-tests.yml"
      - ".github/workflows/release*.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-tests:
    # Run on BOTH Ubuntu and Windows so the bridge's cross-OS behavior (env
    # parsing, path handling, port derivation) is enforced in CI, not just
    # assumed. Mirrors the lint-llm-instructions matrix.
    #
    # Installs with `npm install`: no lockfile is committed for this Unity
    # package (reviewer decision), so there is nothing for `npm ci` to pin
    # and setup-node's npm cache cannot be keyed. The npm project lives under
    # `tooling~/` (Unity-hidden via the tilde suffix, so editors never import
    # node_modules); root package.json scripts delegate with `npm --prefix`.
    #
    # package.json pins exact dependency versions, so the runner-side npm
    # cache (tarballs + packuments, keyed on package.json) keeps repeat
    # installs off the registry without committing a lockfile.
    name: node-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve npm cache directory
        id: npm-cache
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('tooling~/package.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm --prefix tooling~ install --no-audit --no-fund --prefer-offline

      - name: Test tooling
        run: npm --prefix tooling~ test

      - name: Check capture baselines
        # T11 Unity-free integrity gate: baseline schema, scenario coverage,
        # decodability, and provenance (never Unity rendering).
        run: npm --prefix tooling~ run t11:check

      - name: Lint docs catalog and guide links
        # Issue #137: catalog drift/staleness + guide links (xrefs need the
        # docfx API model, generated in the docs-build workflow instead).
        run: npm --prefix tooling~ run lint:docs-catalog

  csharp-style:
    # C# style gates that are pure Node stdlib, so they run Unity-free on both OSes the
    # repo's other Node lanes already matrix (issues #50/#51). Each linter exits non-zero
    # on a violation and refuses to scan nothing, so a broken walk cannot read as green.
    name: csharp-style (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Lint comparison direction
        run: node tooling~/scripts/lint-comparison-direction.mjs

      - name: Lint member ordering
        run: node tooling~/scripts/lint-member-ordering.mjs

      - name: Lint multi-line comments
        run: node tooling~/scripts/lint-multiline-comments.mjs

      - name: Lint LINQ ban in production code
        run: node tooling~/scripts/lint-linq-production.mjs

      - name: Lint explicit string comparisons
        run: node tooling~/scripts/lint-string-equality.mjs

      - name: Lint out-parameter discipline
        run: node tooling~/scripts/lint-out-param-discipline.mjs

      - name: Lint Unity-object null assertions
        run: node tooling~/scripts/lint-unity-null-patterns.mjs

  package-content:
    # Clean-install guard for the UPM artifact (issue #22, PLAN.md T02
    # "package-content validators"): packs the package exactly like npm/UPM
    # consumers receive it and asserts required artifacts ship, tooling and
    # repo-internal files do not, and every shipped file carries its .meta.
    # Unity-free: node stdlib + npm pack + system tar only.
    name: package-content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate package contents
        run: npm --prefix tooling~ run package:validate
