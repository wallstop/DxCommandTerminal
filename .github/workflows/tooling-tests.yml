name: Tooling Tests

on:
  push:
    branches:
      - master
      - main
    paths:
      - "global.json"
      - "package.json"
      - ".devcontainer/**"
      - "tooling~/**"
      - "Runtime/**"
      - "Editor/**"
      - "Packs/**"
      - "Styles/**"
      - "Fonts/**"
      - "Samples~/**"
      - "Tests/**"
      - "Generator~/**"
      - "Documentation~/**"
      # Markdown and root .meta changes are gated by content-gates.yml
      # (lint-md-format, issue #215, and package-validate); nothing in this
      # suite reads them, so they do not buy a two-leg suite run.
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".npmignore"
      - ".npmrc"
      - "tooling~/.npmrc"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "global.json"
      - "package.json"
      - ".devcontainer/**"
      - "tooling~/**"
      - "Runtime/**"
      - "Editor/**"
      - "Packs/**"
      - "Styles/**"
      - "Fonts/**"
      - "Samples~/**"
      - "Tests/**"
      - "Generator~/**"
      - "Documentation~/**"
      # Markdown and root .meta changes are gated by content-gates.yml
      # (lint-md-format, issue #215, and package-validate); nothing in this
      # suite reads them, so they do not buy a two-leg suite run.
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".npmignore"
      - ".npmrc"
      - "tooling~/.npmrc"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-tests:
    # Run on BOTH Ubuntu and Windows so the bridge's cross-OS behavior (env
    # parsing, path handling, port derivation) is enforced in CI, not just
    # assumed. Mirrors the lint-llm-instructions matrix.
    #
    # Installs with `npm install`: no lockfile is committed for this Unity
    # package (reviewer decision), so there is nothing for `npm ci` to pin
    # and setup-node's npm cache cannot be keyed. The npm project lives under
    # `tooling~/` (Unity-hidden via the tilde suffix, so editors never import
    # node_modules); root package.json scripts delegate with `npm --prefix`.
    #
    # Exact pins key the restored dependency tree. On a cache miss, refresh
    # registry metadata so an older npm cache cannot reject a new pin;
    # cached tarballs remain reusable.
    name: node-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache tooling node_modules
        id: tooling-modules
        # Pure-JS devDependencies pinned to exact versions and no lockfile, so
        # a tree restored from package.json's hash is the tree npm install
        # builds; the install below only runs on a miss (a manifest change).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tooling~/node_modules
          key: ${{ runner.os }}-tooling-node_modules-${{ hashFiles('tooling~/package.json') }}

      - name: Resolve npm cache directory
        if: steps.tooling-modules.outputs.cache-hit != 'true'
        id: npm-cache
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm packages
        if: steps.tooling-modules.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('tooling~/package.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        if: steps.tooling-modules.outputs.cache-hit != 'true'
        run: npm --prefix tooling~ install --no-audit --no-fund --prefer-online

      - name: Test tooling
        run: npm --prefix tooling~ test

      - name: Test player evidence suites
        # One interpreter for all four suites (same modules and order as the
        # preflight python-tests gate): unittest aggregates the module list,
        # any suite failure still fails the step, and three fewer steps of
        # per-step overhead leave both legs sooner.
        working-directory: tooling~/scripts/tests
        run: python -m unittest test_verify_opencode test_player_smoke test_player_readiness test_webgl_player

      - name: Check shell entry syntax
        # One file per call: `bash -n a b` checks a and passes b as arguments.
        if: matrix.os == 'ubuntu-latest'
        run: for script in .devcontainer/*.sh; do bash -n "${script}"; done

      - name: Test devcontainer python contracts
        # The devcontainer-facing suites in one interpreter: the lifecycle
        # contract port, the Z.AI/OpenRouter launcher suite, the autoload
        # migration, and the agent CLI installer (the last two drive bash
        # scripts, so they stay on the ubuntu leg with bash).
        if: matrix.os == 'ubuntu-latest'
        working-directory: tooling~/scripts/tests
        run: python -m unittest test_devcontainer test_ai_backends test_install_agent_clis test_install_env_autoload

      - name: Check capture baselines
        # T11 Unity-free integrity gate: baseline schema, scenario coverage,
        # decodability, and provenance (never Unity rendering). Invoked
        # directly: the npm wrapper only adds a startup per step here.
        run: node tooling~/scripts/t11/check.mjs

      - name: Lint docs catalog and guide links
        # Issue #137: catalog drift/staleness + guide links (xrefs need the
        # docfx API model, generated in the docs-build workflow instead).
        run: node tooling~/scripts/lint-docs-catalog.mjs

      - name: Validate package contents
        if: matrix.os == 'ubuntu-latest'
        run: node tooling~/scripts/release/validate-package-contents.mjs

  csharp-lints:
    # The ten C# linters that ran inside both OS legs of node-tests run
    # once here instead. They read tracked bytes,
    # which are OS-identical by checkout (no CRLF rewrite without a matching
    # .gitattributes pin), so the second leg was a duplicate bill - Windows
    # minutes cost twice - and a serial tail on the node-tests job's wall.
    # Dependency-free node scripts: no npm install. The theme palette token
    # lint keeps its own theme-style-lint workflow
    # and its Styles trigger, so it is not repeated here.
    name: csharp-lints (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Lint comparison direction
        run: node tooling~/scripts/lint-comparison-direction.mjs

      - name: Lint member ordering
        run: node tooling~/scripts/lint-member-ordering.mjs

      - name: Lint multi-line comments
        run: node tooling~/scripts/lint-multiline-comments.mjs

      - name: Lint minimal comments
        # Issue #255: a comment must carry the why the code cannot say. A
        # comment whose every content word appears in the line it annotates
        # restates that code; a comment with no content at all says nothing.
        # No --fix by design; deleting or rewriting is a judgement call.
        run: node tooling~/scripts/lint-minimal-comments.mjs

      - name: Lint LINQ ban in production code
        run: node tooling~/scripts/lint-linq-production.mjs

      - name: Lint blocking waits in production code
        # PR #254: every copy command and key handler runs on Unity's main
        # thread, so a sleep, spin, or blocking await freezes the game or
        # editor for its duration. Reason-carrying allow markers are the one
        # exemption (a guarded completed-task read).
        run: node tooling~/scripts/lint-blocking-waits.mjs

      - name: Lint explicit string comparisons
        run: node tooling~/scripts/lint-string-equality.mjs

      - name: Lint exception logging
        run: node tooling~/scripts/lint-exception-tostring.mjs

      - name: Lint out-parameter discipline
        run: node tooling~/scripts/lint-out-param-discipline.mjs

      - name: Lint Unity-object null assertions
        run: node tooling~/scripts/lint-unity-null-patterns.mjs

  devtool-grammar:
    # DxTerminalTestRunReporter only ever compiled inside a host Unity project,
    # so nothing in CI ran it (issue #167). This job links it into a Unity-free
    # project, drives it through the callbacks a real run uses, and decodes the
    # claims it wrote with the real reader - the compile alone is what stops a
    # C# error in a dev tool from reaching a developer machine first (#164).
    # Unity is never provisioned here either: the stand-in is a declared surface,
    # and the host matrix is what answers the real editor.
    #
    # The job self-gates on its own inputs (the grammar project, the reader
    # import in unity-mcp.mjs, the manifest, this workflow): any other change
    # that trips the workflow-level paths cannot affect it, so it skips
    # instead of spending a runner minute. Two-dot diff: over-triggering on
    # an unusual merge shape is safe; under-triggering would skip the gate.
    name: devtool-grammar (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Resolve whether the grammar inputs changed
        id: grammar-inputs
        shell: bash
        run: |
          # Everything the job reads: the grammar project and the two dev
          # tool C# files it compiles, the reader import plus its module-scope
          # t11 imports, SDK pin, npm inputs, and this workflow.
          #
          # The base must span the event's WHOLE change range, not the
          # last commit: a PR diffs from its base SHA (the merge-ref
          # first parent stands in when the payload SHA is absent from
          # the shallow clone), a push diffs from the pushed-over tip
          # (fetched on demand), so a multi-commit push cannot skip the
          # gate on an earlier commit's input change. Last resort is
          # HEAD~1, the same safe direction as the fetch guard.
          base="$PR_BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=""
          fi
          if [ -z "$base" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch -q --no-tags --depth=1 origin "$PUSH_BEFORE" 2>/dev/null && base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD~1)"
          fi
          if git diff --name-only "$base" HEAD -- \
            global.json \
            tooling~/scripts/mcp/grammar \
            tooling~/scripts/mcp/DxTerminalTestRunReporter.cs.txt \
            tooling~/scripts/mcp/DxTerminalStateCapture.cs.txt \
            tooling~/scripts/mcp/unity-mcp.mjs \
            tooling~/scripts/t11/comparator.mjs \
            tooling~/scripts/t11/scenarios.mjs \
            tooling~/package.json \
            tooling~/.npmrc \
            .github/workflows/tooling-tests.yml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.grammar-inputs.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Matches the generator-tests job: the same pinned SDK, so a language or
      # analyzer difference cannot make one gate red and the other green.
      - name: Setup DotNet
        if: steps.grammar-inputs.outputs.changed == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # net8.0 under a newer SDK pulls its targeting and apphost packs from
      # nuget.org, so the shared cold cost is cached here too.
      - name: Cache NuGet packages
        if: steps.grammar-inputs.outputs.changed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'tooling~/scripts/mcp/grammar/DxTerminalClaimGrammar.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The claim reader is imported from unity-mcp.mjs, so this job needs the
      # npm project even though it runs no node suite. The node_modules cache
      # is resolved BEFORE the npm-tarball cache steps that gate on its outcome.
      - name: Cache tooling node_modules
        id: tooling-modules
        if: steps.grammar-inputs.outputs.changed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tooling~/node_modules
          key: ${{ runner.os }}-tooling-node_modules-${{ hashFiles('tooling~/package.json') }}

      - name: Resolve npm cache directory
        if: steps.grammar-inputs.outputs.changed == 'true' && steps.tooling-modules.outputs.cache-hit != 'true'
        id: npm-cache
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm packages
        if: steps.grammar-inputs.outputs.changed == 'true' && steps.tooling-modules.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('tooling~/package.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        if: steps.grammar-inputs.outputs.changed == 'true' && steps.tooling-modules.outputs.cache-hit != 'true'
        run: npm --prefix tooling~ install --no-audit --no-fund --prefer-online

      - name: Check the reporter compiles and its claim grammar round-trips
        if: steps.grammar-inputs.outputs.changed == 'true'
        run: npm --prefix tooling~ run mcp:grammar
