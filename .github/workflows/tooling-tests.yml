name: Tooling Tests

on:
  push:
    branches:
      - master
      - main
    paths:
      - "package.json"
      - "tooling~/**"
      - "Runtime/**"
      - "Editor/**"
      - "Samples~/**"
      - "Tests/**"
      - "Generator~/**"
      - "Documentation~/**"
      - ".config/dotnet-tools.json"
      - ".github/workflows/tooling-tests.yml"
      - ".github/workflows/release*.yml"
  pull_request:
    paths:
      - "package.json"
      - "tooling~/**"
      - "Runtime/**"
      - "Editor/**"
      - "Samples~/**"
      - "Tests/**"
      - "Generator~/**"
      - "Documentation~/**"
      - ".config/dotnet-tools.json"
      - ".github/workflows/tooling-tests.yml"
      - ".github/workflows/release*.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-tests:
    # Run on BOTH Ubuntu and Windows so the bridge's cross-OS behavior (env
    # parsing, path handling, port derivation) is enforced in CI, not just
    # assumed. Mirrors the lint-llm-instructions matrix.
    #
    # Installs with `npm install`: no lockfile is committed for this Unity
    # package (reviewer decision), so there is nothing for `npm ci` to pin
    # and setup-node's npm cache cannot be keyed. The npm project lives under
    # `tooling~/` (Unity-hidden via the tilde suffix, so editors never import
    # node_modules); root package.json scripts delegate with `npm --prefix`.
    #
    # package.json pins exact dependency versions, so the runner-side npm
    # cache (tarballs + packuments, keyed on package.json) keeps repeat
    # installs off the registry without committing a lockfile.
    name: node-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Resolve npm cache directory
        id: npm-cache
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('tooling~/package.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm --prefix tooling~ install --no-audit --no-fund

      - name: Test tooling
        run: npm --prefix tooling~ test

      - name: Check capture baselines
        # T11 Unity-free integrity gate: baseline schema, scenario coverage,
        # decodability, and provenance (never Unity rendering).
        run: npm --prefix tooling~ run t11:check

  csharp-style:
    # C# style gates that are pure Node stdlib, so they run Unity-free on both OSes the
    # repo's other Node lanes already matrix (issues #50/#51). Each linter exits non-zero
    # on a violation and refuses to scan nothing, so a broken walk cannot read as green.
    name: csharp-style (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Lint comparison direction
        run: node tooling~/scripts/lint-comparison-direction.mjs

      - name: Lint member ordering
        run: node tooling~/scripts/lint-member-ordering.mjs

      - name: Lint multi-line comments
        run: node tooling~/scripts/lint-multiline-comments.mjs

      - name: Lint LINQ ban in production code
        run: node tooling~/scripts/lint-linq-production.mjs

      - name: Lint explicit string comparisons
        run: node tooling~/scripts/lint-string-equality.mjs

      - name: Lint out-parameter discipline
        run: node tooling~/scripts/lint-out-param-discipline.mjs

      - name: Lint Unity-object null assertions
        run: node tooling~/scripts/lint-unity-null-patterns.mjs

  package-content:
    # Clean-install guard for the UPM artifact (issue #22, PLAN.md T02
    # "package-content validators"): packs the package exactly like npm/UPM
    # consumers receive it and asserts required artifacts ship, tooling and
    # repo-internal files do not, and every shipped file carries its .meta.
    # Unity-free: node stdlib + npm pack + system tar only.
    name: package-content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate package contents
        run: npm --prefix tooling~ run package:validate

  docs-build:
    # T12 docs site (PLAN.md): builds the searchable static site Unity-free.
    # DocFX (pinned via .config/dotnet-tools.json) extracts the API model
    # from Runtime sources against UnityEngine 2021.3.33 reference
    # assemblies (the package minimum, restored from nuget by
    # tooling~/docs/refs.csproj) - no editor, no license. The rendered
    # site uploads as a PR preview artifact; deployment is a separate,
    # reviewed step (PLAN.md T12).
    name: docs-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.306

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-docs-${{ hashFiles('tooling~/docs/refs.csproj', '.config/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-docs-

      - name: Build the docs site
        run: npm run docs:build

      - name: Upload the site preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: tooling~/docs/obj/_site
          if-no-files-found: error

  compat-2021:
    # Member-level 2021.3 compile tripwire (issue #136). The docs build's
    # docfx extraction only surfaces missing types (CS0246); this lane
    # compiles the real Runtime sources against the same pinned UnityEngine
    # 2021.3.33 reference assemblies, so any member or API absent from the
    # oldest supported editor fails outright (CS1061 and friends). Warnings
    # are errors; the csproj documents the one define it sets and the
    # serialized-field warnings Unity assigns outside C#.
    name: compat-2021
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.306

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-compat-${{ hashFiles('tooling~/compat/runtime-2021.3.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-compat-

      - name: Compile Runtime against 2021.3
        run: npm run compat:check
