name: Unity Meta Lint

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-unity-meta:
    # No path filter: a .meta can lose its target (or a target its .meta) from
    # any commit, so the check runs on every push/PR. The job only queries
    # git ls-files and reads text metas; it stays fast and Unity-free.
    # BOTH OS legs, like the llm lint matrix: the ps1 delegator's Windows
    # wiring (tilde paths through Join-Path, the uv fallback, exit-code
    # propagation) is enforced in CI, not just assumed.
    name: lint-unity-meta (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The linter runs as typed python under uv (issue #220 stage 2); its
      # delegatee prefers uv and falls back to system python, so the setup
      # pins the interpreter the check runs on instead of trusting the
      # runner image's python3.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling~/pyproject.toml

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Lint Unity meta hygiene
        shell: pwsh
        run: ./tooling~/scripts/lint-unity-meta.ps1
