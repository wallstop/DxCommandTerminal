name: Release Publish

# T14 phase 2, second half (issue #85): the publish flow. Fires on a v* tag
# push (the tag the release-tag workflow pushes) and produces every
# distributable without Unity:
#
#   verify         - tag == package.json version == changelog heading (fail
#                    closed on any disagreement); reports the npm dist-tag.
#   validate       - package-content validator, npm pack, sha256, artifact
#                    upload, build-provenance attestation.
#   unitypackage   - required, non-skippable export + sha256 + attestation. A
#                    failed, missing, or empty export blocks publishing.
#   publish-npm    - OIDC Trusted Publishing (--provenance); prerelease ->
#                    next, stable -> latest; skips a version already on the
#                    registry so re-runs are safe.
#   github-release - draft Release with notes from the shared changelog
#                    extractor, uploads + verifies the artifacts, then
#                    publishes. Ordering invariant: npm publish (publish-npm
#                    job) completes strictly before this job runs.
#
# workflow_dispatch exists only for the documented rehearsal (runbook:
# "Rehearsing a release"): dry_run runs verify/validate/unitypackage and
# leaves the Release as a draft - no npm publish, no release publish.
#
# Unity-free by policy: no Unity editor, license, or self-hosted runner is
# ever provisioned here.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v1.0.0-rc26.0 (must exist)
        type: string
        required: true
      dry_run:
        description: Rehearsal - skip publishing; leave the Release as a draft
        type: boolean
        default: false

concurrency:
  # Key on the effective tag, not github.ref: a dispatch re-run of one tag
  # must serialize against the original tag-push run, and dispatches of
  # different tags from the same branch must not share a group.
  group: release-publish-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

permissions: {}

env:
  # Push events carry the tag as the ref; the rehearsal dispatch names it.
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  verify:
    name: verify (${{ github.event_name == 'push' && github.ref_name || inputs.tag }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify tag, package.json, and changelog agreement
        id: verify
        run: |
          version=$(node -p "require('./package.json').version")
          node tooling~/scripts/release/release.mjs verify-release \
            --version "$version" --tag "$TAG" \
            --changelog CHANGELOG.md --github-output "$GITHUB_OUTPUT"

    outputs:
      version: ${{ steps.verify.outputs.version }}
      dist-tag: ${{ steps.verify.outputs.dist-tag }}

  validate:
    name: validate (npm pack + attest)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate shipped package contents
        run: npm --prefix tooling~ run package:validate

      - name: Pack the npm tarball
        run: npm pack

      - name: Checksum
        run: |
          tgz=$(ls com.wallstop-studios.dxcommandterminal-*.tgz)
          sha256sum "$tgz" > "$tgz.sha256"
          cat "$tgz.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: com.wallstop-studios.dxcommandterminal-*.tgz

      - name: Upload tarball artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball
          path: |
            com.wallstop-studios.dxcommandterminal-*.tgz
            com.wallstop-studios.dxcommandterminal-*.tgz.sha256
          if-no-files-found: error

  unitypackage:
    name: unitypackage (required)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Export the .unitypackage
        run: |
          version=${{ needs.verify.outputs.version }}
          artifact="com.wallstop-studios.dxcommandterminal-${version}.unitypackage"
          node tooling~/scripts/release/export-unitypackage.mjs --out "$artifact"

      - name: Reject an empty export
        run: |
          artifact="com.wallstop-studios.dxcommandterminal-${{ needs.verify.outputs.version }}.unitypackage"
          test -s "$artifact" || { echo "::error::$artifact is missing or empty"; exit 1; }

      - name: Checksum
        run: |
          artifact="com.wallstop-studios.dxcommandterminal-${{ needs.verify.outputs.version }}.unitypackage"
          sha256sum "$artifact" > "$artifact.sha256"
          cat "$artifact.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: com.wallstop-studios.dxcommandterminal-*.unitypackage

      - name: Upload unitypackage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unitypackage
          path: |
            com.wallstop-studios.dxcommandterminal-*.unitypackage
            com.wallstop-studios.dxcommandterminal-*.unitypackage.sha256
          if-no-files-found: error

  publish-npm:
    name: publish (npm ${{ needs.verify.outputs.dist-tag }})
    runs-on: ubuntu-latest
    needs: [verify, validate, unitypackage]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup Node (registry + OIDC)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download the tarball
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: npm-tarball

      - name: Decide whether to publish
        id: gate
        run: |
          version=${{ needs.verify.outputs.version }}
          name=$(node -p "require('./package.json').name")
          node tooling~/scripts/release/release.mjs publish-gate \
            --name "$name" --version "$version" --github-output "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: >
          npm publish "com.wallstop-studios.dxcommandterminal-${{ needs.verify.outputs.version }}.tgz"
          --provenance --access public
          --tag "${{ steps.gate.outputs.dist-tag }}"

  github-release:
    name: github-release (draft, then publish)
    runs-on: ubuntu-latest
    # publish-npm is skipped in rehearsal dry-runs; its failure (not skip)
    # blocks this job, so npm publish always precedes a published Release.
    needs: [verify, validate, unitypackage, publish-npm]
    if: >-
      ${{ !cancelled()
      && needs.verify.result == 'success'
      && needs.validate.result == 'success'
      && needs.unitypackage.result == 'success'
      && (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') }}
    permissions:
      contents: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download the artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: "{npm-tarball,unitypackage}"
          merge-multiple: true

      - name: Verify artifacts and checksums
        run: |
          version=${{ needs.verify.outputs.version }}
          prefix="com.wallstop-studios.dxcommandterminal-${version}"
          for artifact in "$prefix.tgz" "$prefix.tgz.sha256" "$prefix.unitypackage" "$prefix.unitypackage.sha256"; do
            test -s "$artifact" || { echo "::error::missing artifact: $artifact"; exit 1; }
          done
          sha256sum --check "$prefix.tgz.sha256" "$prefix.unitypackage.sha256"

      - name: Extract release notes
        run: |
          node tooling~/scripts/release/release.mjs notes \
            --version "${{ needs.verify.outputs.version }}" \
            --changelog CHANGELOG.md --output release-notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-run safety: an existing draft (or published) release is reused
          # instead of failing the re-run. Prerelease versions (dist-tag
          # next) must never become GitHub "Latest", so they carry
          # --prerelease explicitly (gh does not infer it from the tag).
          args=(--draft --title "DxCommandTerminal ${{ needs.verify.outputs.version }}" --notes-file release-notes.md)
          if [ "${{ needs.verify.outputs.dist-tag }}" = "next" ]; then
            args+=(--prerelease)
          fi
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" "${args[@]}"

      - name: Upload and verify the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ needs.verify.outputs.version }}
          prefix="com.wallstop-studios.dxcommandterminal-${version}"
          gh release upload "$TAG" --clobber \
            "$prefix.tgz" "$prefix.tgz.sha256" \
            "$prefix.unitypackage" "$prefix.unitypackage.sha256"
          assets=$(gh release view "$TAG" --json assets --jq '.assets | length')
          test "$assets" -eq 4 || { echo "::error::expected 4 assets, found $assets"; exit 1; }

      - name: Publish the release
        # Rehearsals stop here: the Release stays a draft for review.
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false
