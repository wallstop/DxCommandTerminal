name: Release Publish

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      expected_sha:
        type: string
        required: true
      dry_run:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (required for publishing; omit for candidate rehearsal)
        type: string
        required: false
      candidate_ref:
        description: Rehearsal-only branch or full commit SHA (blank defaults to master when tag is blank)
        type: string
        required: false
      dry_run:
        description: Artifact-only rehearsal (no npm, Release, or attestation writes)
        type: boolean
        default: true

concurrency:
  group: release-publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions: {}

env:
  TAG: ${{ inputs.tag }}

jobs:
  verify:
    name: verify (${{ inputs.tag || inputs.candidate_ref || 'master' }})
    if: github.repository == 'wallstop/DxCommandTerminal' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Select source
        id: source
        env:
          TAG: ${{ inputs.tag }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$TAG" ]; then
            test -z "$CANDIDATE_REF" || { echo "::error::tag and candidate_ref are mutually exclusive"; exit 1; }
            git check-ref-format "refs/tags/$TAG"
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          else
            if [ "$DRY_RUN" != "true" ] || [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              echo "::error::A tag is required except for manual artifact-only rehearsal"; exit 1;
            fi
            ref=${CANDIDATE_REF:-master}
            if [[ ! "$ref" =~ ^[a-f0-9]{40}$ ]]; then
              case "$ref" in
                refs/heads/*) ref=${ref#refs/heads/} ;;
                refs/*) echo "::error::Candidate must be a branch or full commit SHA"; exit 1 ;;
              esac
              [[ "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || exit 1
              ref="refs/heads/$ref"
              git check-ref-format "$ref"
            fi
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      - name: Verify handoff commit
        id: commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_ENABLED: ${{ vars.RELEASE_PUBLISH_ENABLED }}
        run: |
          sha=$(git rev-parse HEAD)
          test -z "$EXPECTED_SHA" || test "$sha" = "$EXPECTED_SHA"
          if [ "$DRY_RUN" != "true" ]; then
            test "$RELEASE_ENABLED" = "true" || { echo "::error::Publishing disabled: maintainer prerequisites not confirmed"; exit 1; }
            test "$sha" = "$GITHUB_SHA" || { echo "::error::Publish commit must match workflow provenance SHA"; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify tag, package.json, and changelog agreement
        id: verify
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -n "$TAG" ]; then
            node tooling~/scripts/release/release.mjs verify-release \
              --version "$version" --tag "$TAG" \
              --changelog CHANGELOG.md --github-output "$GITHUB_OUTPUT"
          else
            node tooling~/scripts/release/release.mjs verify-candidate --dry-run \
              --version "$version" --changelog CHANGELOG.md --github-output "$GITHUB_OUTPUT"
          fi

    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.verify.outputs.version }}
      dist-tag: ${{ steps.verify.outputs.dist-tag }}

  validate:
    name: validate (npm pack)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate shipped package contents
        run: npm --prefix tooling~ run package:validate

      - name: Pack the npm tarball
        run: npm pack

      - name: Checksum
        run: |
          tgz=$(ls com.wallstop-studios.dxcommandterminal-*.tgz)
          sha256sum "$tgz" > "$tgz.sha256"
          cat "$tgz.sha256"

      - name: Upload tarball artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball
          path: |
            com.wallstop-studios.dxcommandterminal-*.tgz
            com.wallstop-studios.dxcommandterminal-*.tgz.sha256
          if-no-files-found: error

  unitypackage:
    name: unitypackage (required)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Export the .unitypackage
        run: |
          version=${{ needs.verify.outputs.version }}
          artifact="com.wallstop-studios.dxcommandterminal-${version}.unitypackage"
          node tooling~/scripts/release/export-unitypackage.mjs --out "$artifact"

      - name: Reject an empty export
        run: |
          artifact="com.wallstop-studios.dxcommandterminal-${{ needs.verify.outputs.version }}.unitypackage"
          test -s "$artifact" || { echo "::error::$artifact is missing or empty"; exit 1; }

      - name: Checksum
        run: |
          artifact="com.wallstop-studios.dxcommandterminal-${{ needs.verify.outputs.version }}.unitypackage"
          sha256sum "$artifact" > "$artifact.sha256"
          cat "$artifact.sha256"

      - name: Upload unitypackage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unitypackage
          path: |
            com.wallstop-studios.dxcommandterminal-*.unitypackage
            com.wallstop-studios.dxcommandterminal-*.unitypackage.sha256
          if-no-files-found: error

  attest:
    runs-on: ubuntu-latest
    needs: [validate, unitypackage]
    if: ${{ !inputs.dry_run }}
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          pattern: "{npm-tarball,unitypackage}"
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            com.wallstop-studios.dxcommandterminal-*.tgz
            com.wallstop-studios.dxcommandterminal-*.unitypackage

  publish-npm:
    name: publish (npm ${{ needs.verify.outputs.dist-tag }})
    runs-on: ubuntu-latest
    environment: release
    needs: [verify, validate, unitypackage, attest]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Setup Node (registry + OIDC)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download the tarball
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: npm-tarball

      - name: Decide whether to publish
        id: gate
        run: |
          version=${{ needs.verify.outputs.version }}
          name=$(node -p "require('./package.json').name")
          node tooling~/scripts/release/release.mjs publish-gate \
            --name "$name" --version "$version" \
            --artifact "com.wallstop-studios.dxcommandterminal-${version}.tgz" --github-output "$GITHUB_OUTPUT"

      - name: Verify remote tag before npm
        run: node tooling~/scripts/release/release.mjs verify-remote-tag --tag "$TAG" --sha "$GITHUB_SHA"

      - name: Publish to npm
        if: ${{ steps.gate.outputs.publish == 'true' }}
        run: >
          npm publish "com.wallstop-studios.dxcommandterminal-${{ needs.verify.outputs.version }}.tgz"
          --provenance --access public
          --tag "${{ steps.gate.outputs.dist-tag }}"

  github-release:
    name: github-release (draft, then publish)
    runs-on: ubuntu-latest
    environment: release
    needs: [verify, validate, unitypackage, publish-npm]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download the artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: "{npm-tarball,unitypackage}"
          merge-multiple: true

      - name: Verify artifacts and checksums
        run: |
          version=${{ needs.verify.outputs.version }}
          prefix="com.wallstop-studios.dxcommandterminal-${version}"
          for artifact in "$prefix.tgz" "$prefix.tgz.sha256" "$prefix.unitypackage" "$prefix.unitypackage.sha256"; do
            test -s "$artifact" || { echo "::error::missing artifact: $artifact"; exit 1; }
          done
          sha256sum --check "$prefix.tgz.sha256" "$prefix.unitypackage.sha256"

      - name: Extract release notes
        run: |
          node tooling~/scripts/release/release.mjs notes \
            --version "${{ needs.verify.outputs.version }}" \
            --changelog CHANGELOG.md --output release-notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-run safety: an existing draft (or published) release is reused
          # instead of failing the re-run. Prerelease versions (dist-tag
          # next) must never become GitHub "Latest", so they carry
          # --prerelease explicitly (gh does not infer it from the tag).
          node tooling~/scripts/release/release.mjs verify-remote-tag --tag "$TAG" --sha "$GITHUB_SHA"
          args=(--verify-tag --draft --title "DxCommandTerminal ${{ needs.verify.outputs.version }}" --notes-file release-notes.md)
          if [ "${{ needs.verify.outputs.dist-tag }}" = "next" ]; then
            args+=(--prerelease)
          fi
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" "${args[@]}"

      - name: Upload and verify the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ needs.verify.outputs.version }}
          prefix="com.wallstop-studios.dxcommandterminal-${version}"
          node tooling~/scripts/release/release.mjs verify-remote-tag --tag "$TAG" --sha "$GITHUB_SHA"
          gh release upload "$TAG" --clobber \
            "$prefix.tgz" "$prefix.tgz.sha256" \
            "$prefix.unitypackage" "$prefix.unitypackage.sha256"
          assets=$(gh release view "$TAG" --json assets --jq '.assets | length')
          test "$assets" -eq 4 || { echo "::error::expected 4 assets, found $assets"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tooling~/scripts/release/release.mjs verify-remote-tag --tag "$TAG" --sha "$GITHUB_SHA"
          gh release edit "$TAG" --draft=false
