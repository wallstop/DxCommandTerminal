name: LLM Instructions Lint

on:
  push:
    branches:
      - master
      - main
    paths:
      - ".llm/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".cursorrules"
      - ".github/copilot-instructions.md"
      - "tooling~/scripts/generate-skills-index.ps1"
      - "tooling~/scripts/lint-llm-instructions.ps1"
      - "tooling~/scripts/lint-skill-sizes.ps1"
      - "tooling~/scripts/python-runner.ps1"
      - "tooling~/**/*.py"
      - ".devcontainer/verify_opencode.py"
      - "tooling~/pyproject.toml"
      - "tooling~/pyrightconfig.json"
      - "tooling~/scripts/tests/**"
      - ".gitattributes"
      - ".github/workflows/llm-instructions-lint.yml"
  pull_request:
    paths:
      - ".llm/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".cursorrules"
      - ".github/copilot-instructions.md"
      - "tooling~/scripts/generate-skills-index.ps1"
      - "tooling~/scripts/lint-llm-instructions.ps1"
      - "tooling~/scripts/lint-skill-sizes.ps1"
      - "tooling~/scripts/python-runner.ps1"
      - "tooling~/**/*.py"
      - ".devcontainer/verify_opencode.py"
      - "tooling~/pyproject.toml"
      - "tooling~/pyrightconfig.json"
      - "tooling~/scripts/tests/**"
      - ".gitattributes"
      - ".github/workflows/llm-instructions-lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-llm-instructions:
    # Run on BOTH Ubuntu and Windows so the skills-index generator's cross-OS
    # determinism (ordinal sort, UTF-8 no BOM, LF) is enforced in CI, not just
    # assumed. An OS-only drift (e.g. a BOM) fails exactly one leg.
    name: lint-llm-instructions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The skill-sizes linter runs as typed python under uv (issue #220
      # stage 1); its delegatee prefers uv and falls back to system python,
      # so the setup pins the interpreter both legs measure against and
      # installs the runner uv uses. The pip cache is keyed on the
      # manifest: the pip install itself only ever fetches the uv wheel
      # (the linters are stdlib-only, and pyright #256 rides uv, not pip),
      # and a manifest edit busts the cache the same way it would for a
      # real dependency.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tooling~/pyproject.toml
            .github/workflows/llm-instructions-lint.yml

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.24

      # Issue #256: the typing gate. Two linters now live in python, so a
      # pinned pyright (basic mode, the pin in pyproject.toml's non-default
      # `typing` group) checks their annotations - the annotated surface can
      # no longer rot silently. Runs once, on the Linux leg only: type-check
      # conclusions are OS-independent here (config pythonPlatform is All),
      # and the repo spends the cross-OS matrix only where generated bytes
      # can drift. The uv cache is what makes the sync warm across runs.
      - name: Cache uv packages
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('tooling~/pyproject.toml', '.github/workflows/llm-instructions-lint.yml') }}

      - name: Type-check python tooling (pyright)
        if: runner.os == 'Linux'
        run: uv run --project tooling~ --group typing pyright --project tooling~

      # One pwsh process per phase instead of one per script: pwsh startup
      # dominates these <1s scripts, worst on Windows. Same scripts, flags,
      # and order as one step each; LASTEXITCODE is checked explicitly because
      # native exit codes do not stop a pwsh script. lint-skill-sizes.ps1 is
      # the delegator to lint_skill_sizes.py. The meta lint keeps its own
      # workflow; only its typed-python test suite runs here (the python
      # runner this job pins is the test surface).
      - name: Lint LLM instructions (contract + sizes)
        shell: pwsh
        run: |
          ./tooling~/scripts/lint-llm-instructions.ps1 -VerboseOutput
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tooling~/scripts/lint-skill-sizes.ps1 -VerboseOutput
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test LLM lint, sizes, meta linter, and index generator
        shell: pwsh
        run: |
          ./tooling~/scripts/tests/test-llm-instructions-lint.ps1 -VerboseOutput
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tooling~/scripts/tests/test-lint-skill-sizes.ps1 -VerboseOutput
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tooling~/scripts/tests/test-lint-unity-meta.ps1 -VerboseOutput
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tooling~/scripts/tests/test-generate-skills-index.ps1 -VerboseOutput
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --project tooling~ python -m unittest discover -s tooling~/scripts/tests -p test_lint_llm_instructions.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
