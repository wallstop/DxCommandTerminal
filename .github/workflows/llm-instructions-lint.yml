name: LLM Instructions Lint

on:
  push:
    branches:
      - master
      - main
    paths:
      - ".llm/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".cursorrules"
      - ".github/copilot-instructions.md"
      - "tooling~/scripts/generate-skills-index.ps1"
      - "tooling~/scripts/lint-llm-instructions.ps1"
      - "tooling~/scripts/lint-skill-sizes.ps1"
      - "tooling~/scripts/lint_skill_sizes.py"
      - "tooling~/pyproject.toml"
      - "tooling~/scripts/tests/**"
      - ".gitattributes"
      - ".github/workflows/llm-instructions-lint.yml"
  pull_request:
    paths:
      - ".llm/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".cursorrules"
      - ".github/copilot-instructions.md"
      - "tooling~/scripts/generate-skills-index.ps1"
      - "tooling~/scripts/lint-llm-instructions.ps1"
      - "tooling~/scripts/lint-skill-sizes.ps1"
      - "tooling~/scripts/lint_skill_sizes.py"
      - "tooling~/pyproject.toml"
      - "tooling~/scripts/tests/**"
      - ".gitattributes"
      - ".github/workflows/llm-instructions-lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-llm-instructions:
    # Run on BOTH Ubuntu and Windows so the skills-index generator's cross-OS
    # determinism (ordinal sort, UTF-8 no BOM, LF) is enforced in CI, not just
    # assumed. An OS-only drift (e.g. a BOM) fails exactly one leg.
    name: lint-llm-instructions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The skill-sizes linter runs as typed python under uv (issue #220
      # stage 1); its delegatee prefers uv and falls back to system python,
      # so the setup pins the interpreter both legs measure against and
      # installs the runner uv uses. The pip cache is keyed on the
      # manifest, which declares no requirements: the only wheel it caches
      # is this ad hoc uv install, and a manifest edit adding a dependency
      # busts the cache the same way it would for a real one.
      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tooling~/pyproject.toml

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      # One pwsh process per phase instead of one per script: pwsh startup
      # dominates these <1s scripts, worst on Windows. Same scripts, flags,
      # and order as one step each; LASTEXITCODE is checked explicitly because
      # native exit codes do not stop a pwsh script. lint-skill-sizes.ps1 is
      # the delegator to lint_skill_sizes.py.
      - name: Lint LLM instructions (contract + sizes)
        shell: pwsh
        run: |
          ./tooling~/scripts/lint-llm-instructions.ps1 -VerboseOutput
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tooling~/scripts/lint-skill-sizes.ps1 -VerboseOutput
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test LLM lint, sizes, and index generator
        shell: pwsh
        run: |
          ./tooling~/scripts/tests/test-llm-instructions-lint.ps1 -VerboseOutput
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tooling~/scripts/tests/test-lint-skill-sizes.ps1 -VerboseOutput
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tooling~/scripts/tests/test-generate-skills-index.ps1 -VerboseOutput
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
