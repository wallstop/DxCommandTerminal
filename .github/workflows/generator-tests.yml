name: Generator Tests

on:
  push:
    branches:
      - master
      - main
    paths:
      - "Generator~/**"
      - "Runtime/Analyzers/**"
      - "Runtime/Attributes/RegisterCommandAttribute.cs"
      - "Runtime/CommandTerminal/Backend/CommandArg.cs"
      - "Runtime/CommandTerminal/Backend/CommandCatalogEntry.cs"
      - "tooling~/scripts/verify-analyzer-payload.ps1"
      - "tooling~/scripts/verify_analyzer_payload.py"
      - "tooling~/scripts/python-runner.ps1"
      - "tooling~/scripts/tests/test_verify_analyzer_payload.py"
      - "tooling~/pyproject.toml"
      - ".github/workflows/generator-tests.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "Generator~/**"
      - "Runtime/Analyzers/**"
      - "Runtime/Attributes/RegisterCommandAttribute.cs"
      - "Runtime/CommandTerminal/Backend/CommandArg.cs"
      - "Runtime/CommandTerminal/Backend/CommandCatalogEntry.cs"
      - "tooling~/scripts/verify-analyzer-payload.ps1"
      - "tooling~/scripts/verify_analyzer_payload.py"
      - "tooling~/scripts/python-runner.ps1"
      - "tooling~/scripts/tests/test_verify_analyzer_payload.py"
      - "tooling~/pyproject.toml"
      - ".github/workflows/generator-tests.yml"
      - ".gitattributes"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generator-tests:
    # Unity-free CI for the shell-discovery generator: the byte-compare needs
    # the pinned SDK (stable compilation → stable byte-compare), the test
    # suite needs the harness. Inspired by the unity-helpers'
    # generator CI contract.
    name: generator-tests (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NuGet restore is shared across tests and payload builds. Keyed on the
      # projects, so a PackageReference change invalidates the cache.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Generator~/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Setup DotNet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.306

      - name: Run generator tests
        run: dotnet test "Generator~/WallstopStudios.DxCommandTerminal.SourceGenerators.Tests/WallstopStudios.DxCommandTerminal.SourceGenerators.Tests.csproj" -c Release

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.24

      - name: Test payload verifier with real compilers
        run: uv run --project tooling~ python -m unittest discover -s tooling~/scripts/tests -p test_verify_analyzer_payload.py -v

      - name: Verify shipped analyzer payload and two-checkout reproducibility
        shell: pwsh
        run: ./tooling~/scripts/verify-analyzer-payload.ps1 -TwoCheckout
