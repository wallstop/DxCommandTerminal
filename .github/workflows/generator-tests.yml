name: Generator Tests

on:
  push:
    branches:
      - master
      - main
    paths:
      - "global.json"
      - "Generator~/**"
      - "Runtime/Analyzers/**"
      - "Runtime/Attributes/RegisterCommandAttribute.cs"
      - "Runtime/CommandTerminal/Backend/CommandArg.cs"
      - "Runtime/CommandTerminal/Backend/CommandCatalogEntry.cs"
      - "tooling~/scripts/verify_analyzer_payload.py"
      - "tooling~/scripts/tests/test_verify_analyzer_payload.py"
      - "tooling~/pyproject.toml"
      - ".github/workflows/generator-tests.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "global.json"
      - "Generator~/**"
      - "Runtime/Analyzers/**"
      - "Runtime/Attributes/RegisterCommandAttribute.cs"
      - "Runtime/CommandTerminal/Backend/CommandArg.cs"
      - "Runtime/CommandTerminal/Backend/CommandCatalogEntry.cs"
      - "tooling~/scripts/verify_analyzer_payload.py"
      - "tooling~/scripts/tests/test_verify_analyzer_payload.py"
      - "tooling~/pyproject.toml"
      - ".github/workflows/generator-tests.yml"
      - ".gitattributes"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generator-tests:
    # Unity-free CI for the shell-discovery generator: the byte-compare needs
    # the pinned SDK (stable compilation → stable byte-compare), the test
    # suite needs the harness. Inspired by the unity-helpers'
    # generator CI contract.
    name: generator-tests (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NuGet restore is shared across tests and payload builds. Keyed on the
      # SDK and projects, so either change invalidates the cache.
      - name: Cache NuGet packages
        id: nuget-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Generator~/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Setup DotNet
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Record runner diagnostics
        if: always()
        shell: bash
        env:
          GENERATOR_DIAGNOSTICS: ${{ runner.temp }}/generator-test-diagnostics
          NUGET_CACHE_HIT: ${{ steps.nuget-cache.outputs.cache-hit }}
          DOTNET_SETUP_OUTCOME: ${{ steps.dotnet.outcome }}
        run: |
          mkdir -p "$GENERATOR_DIAGNOSTICS"
          printf 'GENERATOR_DIAGNOSTICS=%s\n' "$GENERATOR_DIAGNOSTICS" >> "$GITHUB_ENV"
          {
            printf 'workflow=%s\njob=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_WORKFLOW" "$GITHUB_JOB" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'runner_os=%s\nrunner_arch=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'event_sha=%s\ncheckout_revision=' "$GITHUB_SHA"
            git rev-parse HEAD || true
            printf 'nuget_cache_hit=%s\ndotnet_setup_outcome=%s\n' "$NUGET_CACHE_HIT" "$DOTNET_SETUP_OUTCOME"
            printf 'requested_sdk='
            python3 -c 'import json; print(json.load(open("global.json"))["sdk"]["version"])' || printf '<unavailable>\n'
            awk -F ': ' '/^model name/ { print "cpu_model=" $2; found=1; exit } END { if (!found) print "cpu_model=<unavailable>" }' /proc/cpuinfo
            printf 'logical_cpus='; getconf _NPROCESSORS_ONLN
            printf 'available_cpus='; nproc
            awk '/^(MemTotal|MemAvailable):/ { print }' /proc/meminfo
            printf 'loadavg='; cat /proc/loadavg
            for key in DOTNET_TieredCompilation COMPlus_TieredCompilation DOTNET_TieredPGO COMPlus_TieredPGO DOTNET_TC_QuickJit COMPlus_TC_QuickJit DOTNET_TC_QuickJitForLoops COMPlus_TC_QuickJitForLoops DOTNET_ReadyToRun COMPlus_ReadyToRun DOTNET_GCServer DOTNET_gcServer COMPlus_gcServer DOTNET_gcConcurrent COMPlus_gcConcurrent; do
              if [[ -v "$key" ]]; then printf '%s=%s\n' "$key" "${!key}"; else printf '%s=<unset>\n' "$key"; fi
            done
            printf 'selected_sdk='
            dotnet --version || true
            printf 'available_sdks:\n'
            dotnet --list-sdks || true
            printf 'available_runtimes:\n'
            dotnet --list-runtimes || true
          } > "$GENERATOR_DIAGNOSTICS/runner.txt" 2>&1

      - name: Run generator tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test "Generator~/WallstopStudios.DxCommandTerminal.SourceGenerators.Tests/WallstopStudios.DxCommandTerminal.SourceGenerators.Tests.csproj" -c Release --logger "trx;LogFileName=generator-tests.trx" --logger "console;verbosity=normal" --results-directory "$GENERATOR_DIAGNOSTICS" /clp:PerformanceSummary 2>&1 | tee "$GENERATOR_DIAGNOSTICS/generator-tests.log"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.24

      - name: Test payload verifier with real compilers
        shell: bash
        run: |
          set -o pipefail
          uv run --project tooling~ python -m unittest discover -s tooling~/scripts/tests -p test_verify_analyzer_payload.py -v 2>&1 | tee "$GENERATOR_DIAGNOSTICS/payload-verifier-tests.log"

      - name: Verify shipped analyzer payload and two-checkout reproducibility
        shell: bash
        run: |
          set -o pipefail
          uv run --project tooling~ python tooling~/scripts/verify_analyzer_payload.py --two-checkout 2>&1 | tee "$GENERATOR_DIAGNOSTICS/payload-reproducibility.log"

      - name: Retain test runtime configuration
        if: always()
        shell: bash
        env:
          GENERATOR_DIAGNOSTICS: ${{ runner.temp }}/generator-test-diagnostics
        run: |
          mkdir -p "$GENERATOR_DIAGNOSTICS"
          config="Generator~/WallstopStudios.DxCommandTerminal.SourceGenerators.Tests/bin/Release/net9.0/WallstopStudios.DxCommandTerminal.SourceGenerators.Tests.runtimeconfig.json"
          if [[ -f "$config" ]]; then
            cp "$config" "$GENERATOR_DIAGNOSTICS/test.runtimeconfig.json"
            printf 'test_runtimeconfig=retained\n' > "$GENERATOR_DIAGNOSTICS/runtimeconfig-status.txt"
          else
            printf 'test_runtimeconfig=unavailable\n' > "$GENERATOR_DIAGNOSTICS/runtimeconfig-status.txt"
          fi

      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generator-tests-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/generator-test-diagnostics
          if-no-files-found: warn
          retention-days: 7
