version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      ci-dependencies:
        patterns:
          - "*"
    assignees:
      - wallstop
    reviewers:
      - wallstop
    # Repo policy: all action refs are pinned to commit SHAs with a "# vX"
    # version comment (issue #39). Dependabot updates SHA-pinned refs and
    # preserves the comment; keep the comment in sync with each bump.
