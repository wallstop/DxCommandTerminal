repos:
  - repo: local
    hooks:
      - id: dotnet-tool-restore
        name: Install .NET tools
        entry: dotnet tool restore
        language: system
        always_run: true
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
          - post-checkout
          - post-rewrite
        description: Install the .NET tools listed at .config/dotnet-tools.json.
      - id: csharpier
        name: Run CSharpier on C# files
        entry: dotnet tool run Csharpier format
        language: system
        types:
          - c#
        description: CSharpier is an opinionated C# formatter inspired by Prettier.
      - id: comparison-direction-lint
        name: Lint C# comparison direction (only '<' and '<='; issue #51)
        entry: node tooling~/scripts/lint-comparison-direction.mjs
        language: system
        always_run: true
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Every C# comparison reads left-to-right using only '<', '<=' and '=='. A '>'
          that is a comparison (not a generic closer, shift, lambda arrow, or relational
          pattern) fails the hook; use `--fix` to swap operands.
      - id: member-ordering-lint
        name: Lint C# member ordering and nested-type placement (issue #50)
        entry: node tooling~/scripts/lint-member-ordering.mjs
        language: system
        always_run: true
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          One member ordering (const, events, delegates, static properties, static fields,
          properties, fields, constructors, static methods, methods; each tier public >
          protected > internal > private) and nested types at the end of their containing type.
          Use `--fix` for a permutation-only reorder.
      - id: multiline-comments-lint
        name: Lint C# multi-line comments (block comments, not stacked '//'; PR #57 review)
        entry: node tooling~/scripts/lint-multiline-comments.mjs
        language: system
        always_run: true
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Two or more consecutive comment-only '//' lines must be one '/*'...'*/' block
          comment instead. Single '//' lines and '///' doc comments stay legal. Use
          `--fix` to convert runs to block comments.
      - id: linq-production-lint
        name: Lint LINQ ban in production code (Runtime/, Editor/; PR #60 review)
        entry: node tooling~/scripts/lint-linq-production.mjs
        language: system
        always_run: true
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Every LINQ operator allocates enumerators and closures, so shipped code bans
          it outright: 'using System.Linq', qualified 'System.Linq.' calls, and static
          'Enumerable.' calls all fail under Runtime/ and Editor/. No --fix by design;
          rewrite call sites as loops with caller-owned buffers.
      - id: theme-palette-tokens-lint
        name: Lint palette theme tokens (Themes/ coverage, .palette-* var() fallbacks)
        entry: node tooling~/scripts/lint-theme-palette-tokens.mjs
        language: system
        always_run: true
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          The command palette styles only through theme custom properties: every theme
          block in Styles/Themes/*.uss must define the full required-variable list, and
          every var() inside a .palette-* rule in BaseStyles.uss must name a required
          token and carry a fallback so an unthemed palette still renders.
      - id: llm-instructions-lint
        name: Lint .llm instructions (SKILL.md spec, index freshness, pointer delegation)
        entry: pwsh -NoProfile -File tooling~/scripts/lint-llm-instructions.ps1
        language: system
        always_run: true
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Validates the agentic context contract: SKILL.md frontmatter (agentskills.io format),
          generated index freshness and byte-determinism, UTF-8 no BOM / LF encoding, context.md
          structure, and front-end pointer-file delegation to .llm/context.md.
      - id: llm-skill-sizes
        name: Enforce .llm line limits (300 hard, 270 critical)
        entry: pwsh -NoProfile -File tooling~/scripts/lint-skill-sizes.ps1
        language: system
        always_run: true
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Keeps authored LLM context minimal: every authored file under .llm/ must stay at or
          below 300 lines (270+ is a critical warning); the generated skills index is exempt.
      - id: unity-meta-lint
        name: Lint Unity .meta hygiene (orphans, missing metas, guid uniqueness)
        entry: pwsh -NoProfile -File tooling~/scripts/lint-unity-meta.ps1
        language: system
        always_run: true
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Validates Unity .meta hygiene over tracked files: every .meta has its target
          tracked (no orphan metas for gitignored/generated data), every Unity-visible
          file/directory has a tracked .meta, and every meta declares a unique 32-hex guid.
