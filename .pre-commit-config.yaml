repos:
  - repo: local
    hooks:
      - id: dotnet-tool-restore
        name: Install .NET tools
        entry: dotnet tool restore
        language: system
        always_run: true
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
          - post-checkout
          - post-rewrite
        description: Install the .NET tools listed at .config/dotnet-tools.json.
      - id: csharpier
        name: Run CSharpier on C# files
        entry: dotnet tool run Csharpier format
        language: system
        types:
          - c#
        description: CSharpier is an opinionated C# formatter inspired by Prettier.
      # Repo-wide linters are scoped to their input domain: a staged change
      # outside a domain cannot change that domain's verdict, so re-running it
      # per commit only cost wall time (the commit tax was ~25 s, paid again at
      # pre-push). CI (tooling-tests) still runs every linter unconditionally
      # on every push and PR, which keeps the full-repo scan as the backstop.
      - id: comparison-direction-lint
        name: Lint C# comparison direction (only '<' and '<='; issue #51)
        entry: node tooling~/scripts/lint-comparison-direction.mjs
        language: system
        files: \.cs$
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Every C# comparison reads left-to-right using only '<', '<=' and '=='. A '>'
          that is a comparison (not a generic closer, shift, lambda arrow, or relational
          pattern) fails the hook; use `--fix` to swap operands.
      - id: member-ordering-lint
        name: Lint C# member ordering and nested-type placement (issue #50)
        entry: node tooling~/scripts/lint-member-ordering.mjs
        language: system
        files: \.cs$
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          One member ordering (const, events, delegates, static properties, static fields,
          properties, fields, constructors, static methods, methods; each tier public >
          protected > internal > private) and nested types at the end of their containing type.
          Use `--fix` for a permutation-only reorder.
      - id: multiline-comments-lint
        name: Lint C# multi-line comments (block comments, not stacked '//'; PR #57 review)
        entry: node tooling~/scripts/lint-multiline-comments.mjs
        language: system
        files: \.cs$
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Two or more consecutive comment-only '//' lines must be one '/*'...'*/' block
          comment instead. Single '//' lines and '///' doc comments stay legal. Use
          `--fix` to convert runs to block comments.
      - id: minimal-comments-lint
        name: Lint minimal comments (why, never what; issue #255)
        entry: node tooling~/scripts/lint-minimal-comments.mjs
        language: system
        files: \.cs$
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          A comment earns its bytes by carrying the why the code cannot say: a comment
          whose every content word appears in the line it annotates restates that code,
          and a comment with no content at all (a bare //, a marker-only TODO, a dash
          line) says nothing. Both fail lint; no --fix by design. A reason-carrying
          '// minimal-comments:allow: <reason>' marker is the one exemption.
      - id: linq-production-lint
        name: Lint LINQ ban in production code (Runtime/, Editor/; PR #60 review)
        entry: node tooling~/scripts/lint-linq-production.mjs
        language: system
        files: \.cs$
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Every LINQ operator allocates enumerators and closures, so shipped code bans
          it outright: 'using System.Linq', qualified 'System.Linq.' calls, and static
          'Enumerable.' calls all fail under Runtime/ and Editor/. No --fix by design;
          rewrite call sites as loops with caller-owned buffers.
      - id: blocking-waits-lint
        name: Lint blocking waits in production code (Runtime/, Editor/; PR #254 review)
        entry: node tooling~/scripts/lint-blocking-waits.mjs
        language: system
        files: \.cs$
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Every copy command and key handler runs on Unity's main thread, so shipped
          code never blocks it: Thread.Sleep, SpinWait/SpinUntil, Task.Wait/.Result,
          GetAwaiter().GetResult(), WaitOne, Join, and Monitor.Wait all fail under
          Runtime/ and Editor/. A reason-carrying '// blocking-waits:allow: <reason>'
          marker is the one exemption (a guarded completed-task read). No --fix by
          design; replacing a wait is a per-site design decision.
      - id: string-equality-lint
        name: Lint explicit string comparisons (Runtime/, Editor/; PR #73 review)
        entry: node tooling~/scripts/lint-string-equality.mjs
        language: system
        files: \.cs$
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Shipped code compares strings via string.Equals with an explicit StringComparison
          (context.md rule 7): the linter flags ==/!= whose operand is a string literal or
          string.Empty. No --fix by design; Ordinal vs OrdinalIgnoreCase is a semantic
          choice per site, and name-shaped comparisons are OrdinalIgnoreCase by convention.
      - id: out-param-discipline-lint
        name: Lint out-parameter discipline (assign per path, before return; rule 13, issue #119)
        entry: node tooling~/scripts/lint-out-param-discipline.mjs
        language: system
        files: \.cs$
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          An out parameter assigned again on a path that can follow an earlier
          assignment is a blanket fallback that defeats the compiler's
          definite-assignment bugcheck (context.md rule 13, PR #118 review). No
          --fix by design; restoring one-assignment-per-path is a code change.
      - id: exception-tostring-lint
        name: Lint exception logging (Debug.Log-family logs the exception, not .Message)
        entry: node tooling~/scripts/lint-exception-tostring.mjs
        language: system
        files: \.cs$
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Interpolating an exception into a Debug.Log-family call keeps the type, the
          message, and the throw-site stack; .Message keeps only the sentence. The
          in-game funnel renders the message by design, so Terminal.Log and the
          split-channel failure record are out of the rule's subject. No --fix by
          design; where the full exception reads well is a per-call decision.
      - id: theme-palette-tokens-lint
        name: Lint palette theme tokens (Themes/ coverage, .palette-* var() fallbacks)
        entry: node tooling~/scripts/lint-theme-palette-tokens.mjs
        language: system
        files: ^Styles/
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          The command palette styles only through theme custom properties: every theme
          block in Styles/Themes/*.uss must define the full required-variable list, and
          every var() inside a .palette-* rule in BaseStyles.uss must name a required
          token and carry a fallback so an unthemed palette still renders.
      - id: unity-null-patterns-lint
        name: Lint Unity-object null assertions (rule 25, issue #98/#100)
        entry: node tooling~/scripts/lint-unity-null-patterns.mjs
        language: system
        files: \.cs$
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Null assertions evaluate Unity's fake-null operator: Assert.IsNull /
          Assert.IsNotNull bypass it, so tests assert Assert.That(x == null /
          x != null). Use --fix for the mechanical conversion.
      - id: md-format-lint
        name: Lint markdown format (prettier at the 180-char measure, issue #215)
        entry: node tooling~/scripts/lint-md-format.mjs
        language: system
        files: \.md$
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Markdown prose wraps at the repo's 180-character measure: every tracked
          markdown file is prettier-formatted (.prettierrc.json), with code fences
          left byte-identical and the generated skills index excluded. Use --fix
          (npm --prefix tooling~ run lint:md:fix) for the rewrite.
      - id: llm-instructions-lint
        name: Lint .llm instructions (SKILL.md spec, index freshness, pointer delegation)
        entry: uv run --project tooling~ python tooling~/scripts/lint_llm_instructions.py
        language: system
        files: (^\.llm/)|(AGENTS\.md$)|(CLAUDE\.md$)|(^\.cursorrules$)|(^\.github/copilot-instructions\.md$)|(tooling~/scripts/(lint_llm_instructions|generate_skills_index)\.py$)|(tooling~/pyproject\.toml$)
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Validates the agentic context contract: SKILL.md frontmatter (agentskills.io format),
          generated index freshness and byte-determinism, UTF-8 no BOM / LF encoding, context.md
          structure, and front-end pointer-file delegation to .llm/context.md.
      - id: llm-skill-sizes
        name: Enforce .llm line limits (300 hard, 270 critical)
        entry: uv run --project tooling~ python tooling~/scripts/lint_skill_sizes.py
        language: system
        files: (^\.llm/)|(tooling~/scripts/lint_skill_sizes\.py$)|(tooling~/pyproject\.toml$)
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Keeps authored LLM context minimal: every authored file under .llm/ must stay at or
          below 300 lines (270+ is a critical warning); the generated skills index is exempt.
          Implemented by lint_skill_sizes.py (typed python under uv, issue #220).
      - id: unity-meta-lint
        name: Lint Unity .meta hygiene (orphans, missing metas, guid uniqueness)
        entry: uv run --project tooling~ python tooling~/scripts/lint_unity_meta.py
        language: system
        always_run: true
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
        description: >
          Validates Unity .meta hygiene over tracked files: every .meta has its target
          tracked (no orphan metas for gitignored/generated data), every Unity-visible
          file/directory has a tracked .meta, and every meta declares a unique 32-hex guid.
          Implemented by lint_unity_meta.py (typed python under uv, issue #220).
